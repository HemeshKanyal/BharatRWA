[package]
name = "transfer_hook"
version = "0.1.0"
description = "BharatRWA Token-2022 transfer hook: both owners must hold a valid allowlist entry"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "transfer_hook"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []

[dependencies]
anchor-lang = "1.2.1"
anchor-spl = { version = "1.2.1", default-features = false, features = ["token", "token_2022", "token_2022_extensions", "solana-v3"] }
spl-transfer-hook-interface = "2.1.0"
spl-tlv-account-resolution = "0.11.4"
spl-discriminator = "0.5.2"
compliance = { path = "../compliance", features = ["cpi"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
